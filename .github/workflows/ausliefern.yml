# Prüft jeden Push und liefert main auf den Hetzner-Server aus.
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SSH_HOST  IP oder Name des Servers
#   SSH_USER  Benutzer auf dem Server (Mitglied der Gruppe docker)
#   SSH_KEY   privater SSH-Schlüssel (nur für diesen Zweck erzeugt)
#   SSH_PORT  optional, Standard 22
# Solange SSH_HOST fehlt, läuft nur die Prüfung, die Auslieferung wird übersprungen.
name: Prüfen und ausliefern

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ausliefern-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  # E-Rechnung: typische Rechnungsfälle als XRechnung erzeugen und mit dem amtlichen
  # KoSIT-Validator (XRechnung 3.0) prüfen. Läuft nur hier, nicht auf dem Server.
  erechnung:
    runs-on: ubuntu-24.04
    env:
      VALIDATOR: v1.6.3
      KONFIGURATION: v2026-08-31
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx tsx scripts/erechnung-beispiele.ts xr XRECHNUNG
      - name: KoSIT-Validator und XRechnung-Konfiguration laden
        run: |
          gh release download "$VALIDATOR" -R itplr-kosit/validator -p "validator-*.zip" -D dl
          gh release download "$KONFIGURATION" -R itplr-kosit/validator-configuration-xrechnung -p "*.zip" -D dl
          unzip -q dl/validator-*.zip -d val
          unzip -q "$(ls dl/*.zip | grep -v '/validator-[0-9]')" -d konf
      - name: Prüfen
        run: |
          java -cp "$(ls val/validator-*.jar):val/libs/*" de.kosit.validationtool.cmd.CommandLineApplication \
            -s konf/scenarios.xml -r konf -o berichte -h xr/*.xml || true
          fehler=0
          for f in xr/*.xml; do
            b="berichte/$(basename "$f" .xml)-report.xml"
            if [ -f "$b" ] && grep -q "<rep:accept" "$b"; then echo "gültig:   $(basename "$f")"
            else echo "::error::XRechnung ungültig: $(basename "$f")"; [ -f "$b" ] && grep -o 'id="[A-Z-]*[0-9a-z-]*"[^>]*level="error"' "$b" | head -20; fehler=1; fi
          done
          exit $fehler
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xrechnung-pruefberichte
          path: |
            xr
            berichte

  ausliefern:
    needs: [pruefen, erechnung]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      HAT_SERVER: ${{ secrets.SSH_HOST != '' }}
    steps:
      - name: Server eingerichtet?
        if: env.HAT_SERVER != 'true'
        run: echo "::notice::SSH_HOST ist nicht gesetzt – Auslieferung übersprungen. Siehe deploy/EINRICHTUNG.md."

      - uses: actions/checkout@v4
        if: env.HAT_SERVER == 'true'

      - name: Dateien auf den Server kopieren
        if: env.HAT_SERVER == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: /opt/erp/app
          rm: true

      - name: Neu bauen und starten
        if: env.HAT_SERVER == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/erp/app/deploy
            docker compose --env-file /opt/erp/.env up -d --build --remove-orphans
            for i in $(seq 1 40); do
              status=$(docker inspect -f '{{.State.Health.Status}}' erp-app-1 || true)
              [ "$status" = healthy ] && break
              sleep 3
            done
            echo "App-Status: $status"
            [ "$status" = healthy ] || { docker logs --tail 50 erp-app-1; exit 1; }
            docker image prune -f
